# fly launch --no-deploy already done; deploy with: fly deploy
app = "butskograph"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Static site: let it sleep, wake on request. Costs ~nothing when idle,
  # at the price of a ~1s cold start on the first hit.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
